<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exemple de box-sizing</title>
  <style>
    #externe {
      width: 200px;
      height: 200px;
      border-width: 0px;
      border-color: red;
      border-style: solid;

      /* Jouez avec ces parametres */
      /* border-width: 10px; */
      /* padding: 20px; */
      /* margin: 10px; */

      /* Ajout pour mieux voir */
      outline: 2px dotted rebeccapurple;
      transition: all 1s ease-in;
    }

    #interne {
      height: 160px;
      width: auto;
      width: 100%;
      word-wrap: break-word;
      transition: 1s ease-in;
      transition-property: all;

      outline: 1px dashed red;
      border: solid 0px blue;

      /* Jouez avec ces parametres */
      box-sizing: border-box;
      /* border-width: 10px; */
      /* margin: 25px; */
      /* padding: 0px 20px; */
    }
  </style>
</head>

<body>
  <section>
    <h3>Boîte interne à 100% avec <code>box-sizing: border-box;</code></h3>
    <p>Ouvrez l'éditeur de style et jouez avec les paramètres de la boite interne!</p>
    <div id="externe">
      <div id="interne">MMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMM</div>
    </div>
  </section>
</body>

</html>
